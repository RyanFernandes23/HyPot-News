services:
  # 1. The FastAPI Web Server
  - type: web
    name: news-api
    runtime: docker
    plan: starter
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: news-cache
          property: connectionString

  # 2. The General Worker
  - type: worker
    name: news-general-worker
    runtime: docker
    startCommand: uv run src.worker
    plan: starter
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: news-cache
          property: connectionString

  # 3. The Dramatiq Actor
  - type: worker
    name: news-dramatiq-actors
    runtime: docker
    startCommand: uv run dramatiq src.main 
    plan: starter
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: news-cache
          property: connectionString

  # 4. The Redis Instance (Moved inside the services list)
  - type: redis
    name: news-cache
    plan: free
    ipAllowList: [] # Only allow internal traffic